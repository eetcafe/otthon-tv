name: Build and checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk-not-release-signed
          path: app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core regression tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Core.Tests.ps1
      - name: Real Windows Forms inventory smoke test
        shell: powershell
        run: ./windows/Otthon-TV-Kezelo.ps1 -UiSmokeTest
